<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgBanner1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122a" />
      <stop offset="45%" stop-color="#0c1d42" />
      <stop offset="60%" stop-color="#142c5f" />
      <stop offset="100%" stop-color="#1b3b7e" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldNumberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="btnGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="soatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="80%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <linearGradient id="motoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.05" />
    </linearGradient>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="480" rx="28" fill="url(#bgBanner1)" />

  <!-- Background Ambient Glow & Diagonal Lines -->
  <g opacity="0.15">
    <circle cx="950" cy="200" r="280" fill="#38bdf8" filter="blur(60px)" />
    <circle cx="300" cy="400" r="200" fill="#2563eb" filter="blur(50px)" />
    <path d="M650 0 L850 480 M750 0 L950 480 M850 0 L1050 480" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="10 15" />
  </g>

  <!-- ================= LEFT COLUMN: INSTRUCTIONS & COPY ================= -->
  <g transform="translate(60, 48)">
    <!-- Headline -->
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="0.5">
      REDIMIR ES <tspan fill="url(#goldTextGrad)">MUY FÁCIL</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#94a3b8">
      Con SuperGIROS, acumulas puntos y los conviertes en grandes premios.
    </text>

    <!-- STEP 1 -->
    <g transform="translate(0, 125)">
      <!-- Number -->
      <text x="5" y="32" font-family="Georgia, serif" font-weight="900" font-size="36" fill="url(#goldNumberGrad)">1</text>
      <!-- Icon Box -->
      <rect x="40" y="2" width="40" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <path d="M50 14 H68 M50 20 H68 M50 26 H62 M50 32 H65" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
      <!-- Text -->
      <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e2e8f0">
        <tspan font-weight="800" fill="#ffffff">Entra a nuestro “catálogo”</tspan> y escoge la categoría
      </text>
      <text x="95" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
        que quieras redimir.
      </text>
    </g>

    <!-- STEP 2 -->
    <g transform="translate(0, 195)">
      <!-- Number -->
      <text x="5" y="32" font-family="Georgia, serif" font-weight="900" font-size="36" fill="url(#goldNumberGrad)">2</text>
      <!-- Icon Box -->
      <rect x="40" y="2" width="40" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <path d="M48 14 H53 L56 28 H67 L70 18 H54" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="58" cy="32" r="2" fill="#f59e0b" />
      <circle cx="65" cy="32" r="2" fill="#f59e0b" />
      <!-- Text -->
      <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e2e8f0">
        <tspan font-weight="800" fill="#ffffff">Selecciona el premio</tspan> de tu preferencia y da clic en
      </text>
      <text x="95" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
        “Agregar al carrito”.
      </text>
    </g>

    <!-- STEP 3 -->
    <g transform="translate(0, 265)">
      <!-- Number -->
      <text x="5" y="32" font-family="Georgia, serif" font-weight="900" font-size="36" fill="url(#goldNumberGrad)">3</text>
      <!-- Icon Box -->
      <rect x="40" y="2" width="40" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="60" cy="22" r="10" fill="none" stroke="#f59e0b" stroke-width="2" />
      <path d="M56 22 L59 25 L65 19" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Text -->
      <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e2e8f0">
        <tspan font-weight="800" fill="#ffffff">Ve al carrito,</tspan> da clic en redimir y acepta
      </text>
      <text x="95" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
        tu canje o compra de inmediato.
      </text>
    </g>

    <!-- CTA BUTTON -->
    <g transform="translate(40, 342)" filter="url(#badgeShadow)">
      <!-- Metallic Button Outer -->
      <rect x="0" y="0" width="310" height="48" rx="12" fill="url(#btnGrad1)" stroke="#ffffff" stroke-width="2" />
      <rect x="3" y="3" width="304" height="42" rx="9" fill="none" stroke="#94a3b8" stroke-width="1" />
      <text x="155" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#0f172a" text-anchor="middle" letter-spacing="1">
        ¡EMPIEZA A REDIMIR AHORA!
      </text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: 3D REWARD SHOWCASE ================= -->
  <g transform="translate(640, 30)">
    <!-- Ambient Stage Glow -->
    <ellipse cx="270" cy="380" rx="260" ry="40" fill="#0284c7" opacity="0.3" filter="blur(20px)" />

    <!-- Glass Billboard Backdrop -->
    <rect x="60" y="25" width="420" height="180" rx="24" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="70" y="35" width="400" height="160" rx="18" fill="#0f172a" fill-opacity="0.3" />

    <!-- SuperGIROS Brand Pill -->
    <g transform="translate(190, 48)">
      <!-- Blue sphere logo -->
      <circle cx="20" cy="18" r="14" fill="#0284c7" />
      <ellipse cx="20" cy="18" rx="18" ry="7" fill="none" stroke="#e0f2fe" stroke-width="2.5" transform="rotate(-25 20 18)" />
      <text x="48" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="0.5">
        SuperGIROS<tspan font-size="14" dy="-8">®</tspan>
      </text>
    </g>

    <!-- SuperSOAT + Póliza 3D Badge -->
    <g transform="translate(100, 92)" filter="url(#shadowGlow)">
      <text x="170" y="60" font-family="Impact, sans-serif" font-weight="900" font-size="54" fill="#0c4a6e" text-anchor="middle" letter-spacing="1">
        SuperSOAT
      </text>
      <text x="168" y="58" font-family="Impact, sans-serif" font-weight="900" font-size="54" fill="#ffffff" stroke="#ffffff" stroke-width="8" text-anchor="middle" letter-spacing="1">
        SuperSOAT
      </text>
      <text x="168" y="58" font-family="Impact, sans-serif" font-weight="900" font-size="54" fill="url(#soatGrad)" text-anchor="middle" letter-spacing="1">
        SuperSOAT
      </text>
      <text x="295" y="85" font-family="Impact, sans-serif" font-style="italic" font-weight="900" font-size="34" fill="#ffffff" stroke="#0369a1" stroke-width="4" letter-spacing="1">
        +Póliza*
      </text>
      <text x="295" y="85" font-family="Impact, sans-serif" font-style="italic" font-weight="900" font-size="34" fill="#ea580c" letter-spacing="1">
        +Póliza*
      </text>
    </g>

    <!-- Red Sedan Car Graphic -->
    <g transform="translate(10, 230)" filter="url(#shadowGlow)">
      <!-- Car Body -->
      <path d="M20 110 Q40 50 110 30 Q180 15 260 20 Q310 40 330 75 Q350 90 350 110 Q320 120 20 120 Z" fill="url(#carBodyGrad)" />
      <!-- Roof & Windows -->
      <path d="M70 45 Q120 20 200 20 Q245 20 275 45 Z" fill="#0f172a" opacity="0.85" />
      <path d="M90 42 Q130 25 185 25 L185 45 Z" fill="#38bdf8" opacity="0.4" />
      <path d="M195 25 Q235 25 265 45 L195 45 Z" fill="#38bdf8" opacity="0.3" />
      <!-- Headlights -->
      <polygon points="325,75 348,82 342,92 320,85" fill="#fef08a" filter="url(#shadowGlow)" />
      <polygon points="22,95 15,102 24,108 30,102" fill="#ef4444" />
      <!-- Wheels -->
      <circle cx="80" cy="115" r="26" fill="#1e293b" stroke="#475569" stroke-width="4" />
      <circle cx="80" cy="115" r="14" fill="#94a3b8" />
      <circle cx="280" cy="115" r="26" fill="#1e293b" stroke="#475569" stroke-width="4" />
      <circle cx="280" cy="115" r="14" fill="#94a3b8" />
    </g>

    <!-- Blue Scooter / Motorcycle Graphic -->
    <g transform="translate(320, 200)" filter="url(#shadowGlow)">
      <!-- Body -->
      <path d="M20 110 Q35 70 65 65 L95 85 Q115 50 135 20 L145 22 Q125 70 120 110 Z" fill="url(#motoGrad)" />
      <!-- Seat -->
      <path d="M45 65 Q70 60 95 65 L90 75 Q65 72 45 72 Z" fill="#0f172a" />
      <!-- Handlebar -->
      <line x1="130" y1="18" x2="155" y2="25" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <circle cx="140" cy="20" r="8" fill="#fef08a" />
      <!-- Mirrors -->
      <circle cx="125" cy="8" r="5" fill="#334155" stroke="#94a3b8" stroke-width="2" />
      <circle cx="158" cy="10" r="5" fill="#334155" stroke="#94a3b8" stroke-width="2" />
      <!-- Wheels -->
      <circle cx="35" cy="130" r="22" fill="#1e293b" stroke="#64748b" stroke-width="3" />
      <circle cx="35" cy="130" r="10" fill="#cbd5e1" />
      <circle cx="130" cy="130" r="22" fill="#1e293b" stroke="#64748b" stroke-width="3" />
      <circle cx="130" cy="130" r="10" fill="#cbd5e1" />
    </g>

    <!-- Gift Box & Tech Prizes in Center Stage -->
    <g transform="translate(190, 285)" filter="url(#shadowGlow)">
      <!-- Gift Box Base -->
      <rect x="40" y="35" width="90" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <!-- Ribbon vertical -->
      <rect x="78" y="35" width="14" height="70" fill="#f59e0b" />
      <!-- Ribbon horizontal -->
      <rect x="40" y="65" width="90" height="12" fill="#f59e0b" />
      <!-- Ribbon Bow -->
      <ellipse cx="78" cy="30" rx="14" ry="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
      <ellipse cx="92" cy="30" rx="14" ry="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
      <!-- Sparkles -->
      <polygon points="85,15 88,23 96,26 88,29 85,37 82,29 74,26 82,23" fill="#fde047" />

      <!-- Smart TV Screen Behind -->
      <rect x="-35" y="-10" width="70" height="42" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <rect x="-32" y="-7" width="64" height="36" rx="2" fill="url(#bgBanner1)" />
      <line x1="0" y1="32" x2="0" y2="40" stroke="#94a3b8" stroke-width="3" />
      <line x1="-10" y1="40" x2="10" y2="40" stroke="#94a3b8" stroke-width="3" />

      <!-- Smartphone -->
      <rect x="135" y="10" width="22" height="42" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="137" y="14" width="18" height="34" rx="2" fill="#3b82f6" />
      <circle cx="146" cy="45" r="1.5" fill="#ffffff" />
    </g>

    <!-- Shiny Stars Overlay -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="110" cy="50" r="2.5" />
      <circle cx="470" cy="180" r="2" />
      <circle cx="340" cy="40" r="1.5" />
      <polygon points="460,70 463,78 471,81 463,84 460,92 457,84 449,81 457,78" fill="#fde047" />
    </g>
  </g>
</svg>
