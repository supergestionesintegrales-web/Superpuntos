<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad100" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D72" />
      <stop offset="60%" stop-color="#0043A8" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="shadow100" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001845" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="560" height="340" rx="24" fill="url(#cardGrad100)" filter="url(#shadow100)" />

  <!-- Decorative Curves / Holographic waves -->
  <path d="M 20 180 Q 200 90 380 200 T 580 140 L 580 360 L 20 360 Z" fill="#001E50" opacity="0.35" />
  <path d="M 20 240 Q 180 160 360 260 T 580 220 L 580 360 L 20 360 Z" fill="#0052CC" opacity="0.25" />
  <circle cx="500" cy="80" r="140" fill="#00A3E0" opacity="0.12" />
  <circle cx="80" cy="300" r="90" fill="#F59E0B" opacity="0.10" />

  <!-- Card Border -->
  <rect x="20" y="20" width="560" height="340" rx="24" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Header: Logo & Badge -->
  <g transform="translate(50, 48)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#F59E0B" />
    <polygon points="19,6 31,30 22,30 19,23 16,30 7,30" fill="#002D72" font-weight="bold" />
    <circle cx="19" cy="18" r="4" fill="#002D72" />
    <text x="48" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">SUPER<tspan fill="#FDE047">PUNTOS</tspan></text>
    <text x="49" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#93C5FD" letter-spacing="2">RED OFICIAL SUPERGIROS</text>
  </g>

  <!-- Digital Badge -->
  <g transform="translate(420, 52)">
    <rect x="0" y="0" width="125" height="30" rx="15" fill="#10B981" />
    <text x="62" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="0.5">BONO DIGITAL</text>
  </g>

  <!-- Smart Chip Graphic -->
  <g transform="translate(50, 115)">
    <rect x="0" y="0" width="52" height="40" rx="8" fill="url(#chipGrad)" stroke="#64748B" stroke-width="1" />
    <path d="M 0 20 L 52 20 M 26 0 L 26 40 M 12 0 L 12 40 M 40 0 L 40 40" stroke="#475569" stroke-width="0.75" opacity="0.6" />
    <rect x="18" y="12" width="16" height="16" rx="4" fill="none" stroke="#334155" stroke-width="0.75" />
  </g>

  <!-- App SuperGIROS Indicator -->
  <g transform="translate(115, 122)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#BAE6FD" letter-spacing="0.5">ACREDITACIÓN INMEDIATA</text>
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" opacity="0.85">En tu saldo App SuperGiros Móvil</text>
  </g>

  <!-- Denomination: Large $100.000 COP -->
  <g transform="translate(50, 235)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="url(#goldGrad)" letter-spacing="-1">$100.000 <tspan font-size="24" font-weight="700" fill="#F8FAFC">COP</tspan></text>
    <text x="2" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#93C5FD" letter-spacing="1">CANJEABLE POR 70 PUNTOS • VÁLIDO PARA CUALQUIER SERVICIO</text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(50, 315)">
    <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94A3B8">COD: SP-BONO-100K-DIGITAL</text>
  </g>
  <g transform="translate(420, 315)">
    <text x="125" y="14" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FDE047">APP SUPERGIROS</text>
  </g>
</svg>
