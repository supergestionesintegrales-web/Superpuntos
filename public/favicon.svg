<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Royal SuperGIROS Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#09122c" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Inner Coin Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Sparkle Glow -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Badge / Container -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Glow Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Golden Coin Body with Shadow -->
  <circle cx="32" cy="32" r="20" fill="url(#goldGrad)" filter="url(#shadow)" />

  <!-- Coin Inner Border Rim -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#rimGrad)" stroke-width="1.5" stroke-dasharray="3 1.5" />

  <!-- Coin Core -->
  <circle cx="32" cy="32" r="14.5" fill="#f59e0b" fill-opacity="0.25" />

  <!-- Bold Embossed "S" (Superpuntos) -->
  <path d="M36 22.5 C36 21 34.5 20 32 20 C29 20 27.2 21.2 27 23.2 C26.8 25.2 28.2 26.5 31 27.3 L33 27.9 C36.2 28.9 38 30.7 37.8 33.8 C37.5 37.2 34.6 39 31.5 39 C27.8 39 25.5 37.2 25.2 34.5 L28.2 34.1 C28.4 35.6 29.8 36.6 31.5 36.6 C33.4 36.6 34.8 35.6 35 34 C35.2 32.5 34.2 31.5 31.8 30.8 L29.8 30.2 C26.2 29.1 24.2 27.2 24.5 23.8 C24.8 20.4 27.8 17.6 32 17.6 C36.2 17.6 38.6 19.8 38.8 22.8 Z" 
        fill="#ffffff" 
        filter="url(#shadow)" />

  <!-- Star Sparkle 1 (Top Right) -->
  <path d="M49 13 Q49 17 53 17 Q49 17 49 21 Q49 17 45 17 Q49 17 49 13 Z" fill="url(#sparkleGrad)" />

  <!-- Star Sparkle 2 (Bottom Left) -->
  <path d="M14 46 Q14 49 17 49 Q14 49 14 52 Q14 49 11 49 Q14 49 14 46 Z" fill="url(#sparkleGrad)" opacity="0.9" />

  <!-- Tiny Highlight Dot -->
  <circle cx="47" cy="27" r="1.2" fill="#ffffff" opacity="0.8" />
</svg>
